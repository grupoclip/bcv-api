name: Publish PHP library

# Releases packages/php/ as the Composer package `grupoclip/bcv-today` (https://packagist.org/packages/grupoclip/bcv-today).
#
# Packagist needs composer.json at the root of a repository, so this workflow splits packages/php/ out of this
# monorepo (git subtree split) and pushes the result to the read-only mirror https://github.com/grupoclip/bcv-today-php:
# the split history goes to its `main` branch and the release tag `v<version>` is created there. Packagist tracks
# that mirror and picks the new tag up.
#
# Cut a release by bumping BcvToday\Version::VERSION (packages/php/src/Version.php) and CHANGELOG.md, then pushing a
# tag php-vX.Y.Z that matches it, e.g.:
#   git tag php-v1.0.0 && git push origin php-v1.0.0
#
# Setup (done once):
#   - grupoclip/bcv-today-php is an empty public mirror (issues disabled; issues go to grupoclip/bcv-api). Never
#     commit to it directly: every release must fast-forward its main.
#   - It has a write deploy key "bcv-api publish-php (Actions)"; the private half is the secret
#     PHP_SPLIT_DEPLOY_KEY of the environment "packagist" in this repository, so only this job can push there.
#   - The same environment holds PACKAGIST_USERNAME and PACKAGIST_TOKEN (Packagist API token); the last step asks
#     Packagist to re-read the mirror so the new tag shows up at once.
on:
  push:
    tags:
      - "php-v*"

permissions:
  contents: read

concurrency:
  group: publish-php
  cancel-in-progress: false

env:
  SPLIT_REPOSITORY: grupoclip/bcv-today-php

jobs:
  test:
    name: Check version and test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.4"]
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none
      - name: Check that the tag matches the package version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(php -r 'require "src/Version.php"; echo BcvToday\Version::VERSION;')
          if [ "${TAG}" != "php-v${version}" ]; then
            echo "::error::Tag ${TAG} does not match BcvToday\\Version::VERSION ${version} (expected php-v${version})."
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            exit 1
          fi
          echo "Releasing grupoclip/bcv-today ${version}"
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Lint, analyse and test
        run: |
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/phpunit

  split:
    name: Split packages/php into ${{ github.repository_owner }}/bcv-today-php
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: packagist
      url: https://packagist.org/packages/grupoclip/bcv-today
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # subtree split needs the full history
          persist-credentials: false
      - name: Split packages/php (composer.json becomes the repository root)
        run: |
          git subtree split --prefix=packages/php -b php-split
          git log --oneline -n 3 php-split
      - name: Push the split history to main and tag v<version>
        env:
          TAG: ${{ github.ref_name }}
          PHP_SPLIT_DEPLOY_KEY: ${{ secrets.PHP_SPLIT_DEPLOY_KEY }}
        run: |
          if [ -z "${PHP_SPLIT_DEPLOY_KEY}" ]; then
            echo "::error::The secret PHP_SPLIT_DEPLOY_KEY is not set (see the setup notes at the top of this workflow)."
            exit 1
          fi
          key="${RUNNER_TEMP}/split_key"
          printf '%s\n' "${PHP_SPLIT_DEPLOY_KEY}" > "${key}"
          chmod 600 "${key}"
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          version="${TAG#php-v}"
          remote="git@github.com:${SPLIT_REPOSITORY}.git"
          if git ls-remote --exit-code --tags "${remote}" "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists in ${SPLIT_REPOSITORY}."
            exit 1
          fi
          # The split is deterministic, so a release only fast-forwards main; a rejected push means someone
          # committed to the mirror directly and must be investigated (no --force on purpose).
          git push "${remote}" "php-split:refs/heads/main"
          git tag "v${version}" php-split
          git push "${remote}" "refs/tags/v${version}"
          rm -f "${key}"
          echo "Pushed ${SPLIT_REPOSITORY} main and v${version}."
      - name: Ask Packagist to update grupoclip/bcv-today
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "::warning::Packagist credentials are not set; Packagist will see the tag on its next scheduled crawl."
            exit 0
          fi
          curl --fail --show-error --silent -X POST \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"repository\":{\"url\":\"https://github.com/${SPLIT_REPOSITORY}\"}}"
          echo
