name: Publish Python library

# Publishes python/ to https://pypi.org/project/bcv/ with PyPI Trusted Publishing
# (OIDC, no API tokens). Cut a release by pushing a tag py-vX.Y.Z that matches
# __version__ in python/bcv/_version.py, e.g.:
#   git tag py-v1.0.0 && git push origin py-v1.0.0
on:
  push:
    tags:
      - "py-v*"

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('bcv/_version.py').read_text()).group(1))")
          if [ "${TAG}" != "py-v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version} (expected py-v${version})."
            exit 1
          fi
          echo "Releasing bcv ${version}"
      - name: Test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bcv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
