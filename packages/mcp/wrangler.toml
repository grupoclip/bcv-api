# BCV Today remote MCP server (stateless Streamable HTTP, no Durable Objects).
#
# IMPORTANT: this Worker must only ever serve the mcp.bcv.today custom domain.
# Never add a route on bcv.today/* — a Worker on the apex runs on every site
# request and burns the free 100k/day Workers quota.
name = "bcv-today-mcp"
main = "src/index.ts"
account_id = "d0158136a182d911d74096e2aa11332d"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "mcp.bcv.today", custom_domain = true }
]

[vars]
# Where the static JSON API lives. Read-only; never bcv.org.ve.
DATA_ORIGIN = "https://bcv.today"
# Telegram channel for the daily rate post (the bot must be an admin there).
TELEGRAM_CHANNEL = "@bcvtoday"

# Telegram bot (@BCVTodayBot): subscriptions and the last announced date.
# Secrets (not in this file): TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET.
[[kv_namespaces]]
binding = "TELEGRAM_KV"
id = "2d611aa95f9f47fea44be4d821e692bd"

# Checks every 10 minutes whether the BCV published a new rate (one KV read
# when nothing changed). Posts once per effective date.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
