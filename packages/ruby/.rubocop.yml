AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# The business rules and renderers mirror the other clients one function at a time: long but linear.
Metrics/AbcSize:
  Max: 40
Metrics/MethodLength:
  Max: 40
Metrics/ClassLength:
  Max: 300
  Exclude:
    - "test/**/*"
Metrics/ModuleLength:
  Max: 300
Metrics/BlockLength:
  Exclude:
    - "lib/bcv/models.rb"
    - "test/**/*"
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ParameterLists:
  Max: 7
