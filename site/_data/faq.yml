es:
  homepage:
    title: "Preguntas frecuentes"
    items:
      - question: "¿Cuál es el dólar BCV hoy?"
        answer: "El dólar BCV hoy es la tasa oficial USD/VES publicada por el Banco Central de Venezuela. BCV Today la muestra en la página principal y en la página dedicada al dólar BCV."
      - question: "¿A qué hora actualiza el BCV la tasa?"
        answer: "El BCV suele publicar la tasa en días hábiles alrededor de las 4:30 p. m., hora de Caracas, con vigencia para el siguiente día hábil."
      - question: "¿La API BCV requiere clave?"
        answer: "No. La API JSON de BCV Today es pública, de solo lectura y no requiere clave de acceso."
      - question: "¿Qué significa Fecha Valor?"
        answer: "Es el día desde el que rige la tasa. El BCV la publica en la tarde y casi siempre aplica desde el siguiente día hábil, por eso aquí verás dos datos: cuándo se capturó la tasa y su fecha valor. En fines de semana y feriados sigue vigente la última tasa publicada. Si comparas fuentes, compara la fecha valor y no la hora de publicación."
      - question: "¿Para qué se usa la tasa BCV?"
        answer: "Para convertir a bolívares un precio en dólares, revisar un pago recibido o fijar el cambio de una factura. En un sistema, la API devuelve el mismo valor que ves aquí, sin copiarlo a mano."
      - question: "¿Qué monedas publica el BCV?"
        answer: "Dólar estadounidense, euro, yuan chino, lira turca y rublo ruso, todas frente al bolívar. Cada una tiene su página con la tasa del día y los valores recientes, y el histórico diario las reúne todas."
      - question: "¿Dólar BCV hoy es lo mismo que Dolartoday BCV?"
        answer: "No. Esta página muestra solo la tasa oficial USD/VES del Banco Central de Venezuela, la misma que publica bcv.org.ve. Dolartoday y el precio de USDT en aplicaciones P2P son otro mercado. Si llegaste buscando «bcvhoy» o «dólar BCV hoy», este es el número del BCV."
      - question: "¿Este sitio es oficial del BCV?"
        answer: "No. BCV Today es un proyecto no oficial que toma los datos publicados por el Banco Central de Venezuela y los organiza como sitio web y API estática."
  currency:
    title: "Preguntas frecuentes"
    items:
      - question: "¿Esta tasa es oficial?"
        answer: "La tasa mostrada proviene de los datos publicados por el Banco Central de Venezuela. BCV Today no es un sitio oficial del BCV."
      - question: "¿Dónde puedo ver el histórico?"
        answer: "Cada página de moneda enlaza al histórico diario, donde puedes revisar la evolución de la tasa frente al bolívar."
      - question: "¿Puedo consumir esta tasa por API?"
        answer: "Sí. La API pública devuelve la tasa vigente, el histórico y una ruta de estado, sin autenticación."

en:
  homepage:
    title: "Frequently asked questions"
    items:
      - question: "What is the BCV dollar today?"
        answer: "The BCV dollar today is the official USD/VES rate published by Banco Central de Venezuela. BCV Today shows it on the homepage and on the dedicated BCV dollar page."
      - question: "What time does BCV update the exchange rate?"
        answer: "BCV usually publishes rates on business days around 4:30 p.m. Caracas time, effective for the next business day."
      - question: "Does the BCV API require an API key?"
        answer: "No. BCV Today's JSON API is public, read-only and does not require an access key."
      - question: "What does value date mean?"
        answer: "It is the day the rate takes effect. BCV publishes it in the afternoon and it usually applies from the next business day, so this site shows two things: when the rate was captured and its value date. On weekends and holidays the last published rate stays in effect. When you compare sources, compare the value date, not the publication time."
      - question: "What is the BCV rate used for?"
        answer: "To convert a dollar price to bolívares, check a payment you received or set the exchange rate on an invoice. In a system, the API returns the same value you see here, without copying it by hand."
      - question: "Which currencies does BCV publish?"
        answer: "US dollar, euro, Chinese yuan, Turkish lira and Russian ruble, all against the bolívar. Each one has a page with today's rate and recent values, and the daily history brings them all together."
      - question: "Is BCV dollar today the same as Dolartoday BCV?"
        answer: "No. This page only shows the official USD/VES rate from Banco Central de Venezuela, the same one bcv.org.ve publishes. Dolartoday and the USDT price on P2P apps belong to another market. If you searched for \"dolar bcv hoy\" or \"BCV dollar today\", this is the BCV number."
      - question: "Is this an official BCV website?"
        answer: "No. BCV Today is an unofficial project that reads public data published by Banco Central de Venezuela and organizes it as a website and static API."
  currency:
    title: "Frequently asked questions"
    items:
      - question: "Is this an official rate?"
        answer: "The displayed rate comes from data published by Banco Central de Venezuela. BCV Today is not an official BCV website."
      - question: "Where can I view the history?"
        answer: "Each currency page links to the daily history, where you can review how the rate has changed against the bolivar."
      - question: "Can I consume this rate through an API?"
        answer: "Yes. The public API returns the latest rate, the history index and a status endpoint without authentication."
